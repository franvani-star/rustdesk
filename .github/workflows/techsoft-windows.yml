name: Build Assistenza Techsoft (Windows x64)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # Branding: il nome interno resta quello del client rdgen, cosi' ID e configurazione restano gli stessi
  APP_NAME: "Assistenza-TechSoft"
  RENDEZVOUS_SERVER: "192.99.17.202"
  RS_PUB_KEY: "hXM2JudP7TgjZ3NaNoIV5yg8H7E5qCByxCtQtY5MVK4="
  EXE_NAME: "AssistenzaTechsoft.exe"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Apply Techsoft branding and server
        shell: pwsh
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $cfgPath = (Resolve-Path "libs\hbb_common\src\config.rs").Path
          $cfg = [IO.File]::ReadAllText($cfgPath)
          $patches = @(
            @{ P = '(?m)^pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[[^\]]*\];'; R = "pub const RENDEZVOUS_SERVERS: &[&str] = &[""$env:RENDEZVOUS_SERVER""];" },
            @{ P = '(?m)^pub const RS_PUB_KEY: &str = "[^"]*";'; R = "pub const RS_PUB_KEY: &str = ""$env:RS_PUB_KEY"";" },
            @{ P = 'pub static ref APP_NAME: RwLock<String> = RwLock::new\("RustDesk"\.to_owned\(\)\);'; R = "pub static ref APP_NAME: RwLock<String> = RwLock::new(""$env:APP_NAME"".to_owned());" }
          )
          foreach ($p in $patches) {
            $n = [regex]::Matches($cfg, $p.P).Count
            if ($n -ne 1) { throw "Pattern trovato $n volte invece di 1: $($p.P)" }
            $cfg = [regex]::Replace($cfg, $p.P, $p.R)
          }
          [IO.File]::WriteAllText($cfgPath, $cfg, $utf8)
          Select-String -Path $cfgPath -Pattern 'RENDEZVOUS_SERVERS: |RS_PUB_KEY: |APP_NAME: '

          $rcPath = (Resolve-Path "flutter\windows\runner\Runner.rc").Path
          $rc = [IO.File]::ReadAllText($rcPath)
          $rc = $rc -replace 'VALUE "CompanyName", "[^"]*"', 'VALUE "CompanyName", "Techsoft"'
          $rc = $rc -replace 'VALUE "FileDescription", "[^"]*"', 'VALUE "FileDescription", "Assistenza Techsoft"'
          $rc = $rc -replace 'VALUE "ProductName", "[^"]*"', 'VALUE "ProductName", "Assistenza Techsoft"'
          [IO.File]::WriteAllText($rcPath, $rc, $utf8)
          Select-String -Path $rcPath -Pattern 'CompanyName|FileDescription|ProductName'

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: techsoft-windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Copy Runner.res for the portable packer icon
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -n 1)
          if [ -n "$runner_res" ]; then cp "$runner_res" ./libs/portable/Runner.res; else echo "Runner.res non trovato"; fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./dist
          mv ./target/release/rustdesk-portable-packer.exe "./dist/${EXE_NAME}"
          ls -l ./dist

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AssistenzaTechsoft-Windows-x64
          path: ./dist
          if-no-files-found: error
          retention-days: 30
